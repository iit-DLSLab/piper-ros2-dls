[workspace]
name = "piper_ros2_env"
platforms = ["linux-64"]
channels = ["conda-forge"]

[feature.common.dependencies]
pip = "*"
python = "*"
numpy = "*"
scipy = "*"
pyyaml = "*"
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
colcon-common-extensions = "*"
catkin_tools = "*"
rosdep = "*"
tqdm = "*"
# pyAgxArm (built by colcon through the piper_sdk wrapper package)
python-can = ">=3.3.4"
typing-extensions = "*"

[feature.common.pypi-dependencies]
# agx_arm_pd_g_controller (python3-mujoco-pip)
mujoco = "*"
# AgileX CAN driver (git submodule), imported directly by the DLS HAL
# (launch_piper_hal.py builds only dls2_interface, not the piper_sdk wrapper)
pyagxarm = { path = "pyAgxArm", editable = true }

[feature.common.activation.env]
# Restrict DDS discovery to this machine. Each distro reads only one of the two:
# humble -> ROS_LOCALHOST_ONLY; jazzy+/lyrical -> ROS_AUTOMATIC_DISCOVERY_RANGE
# (ros_environment otherwise defaults it to SUBNET, i.e. the whole LAN).
ROS_LOCALHOST_ONLY = "1"
ROS_AUTOMATIC_DISCOVERY_RANGE = "LOCALHOST"
# A comma decimal separator (e.g. it_IT) breaks URDF/SRDF number parsing in MoveIt/RViz
LC_NUMERIC = "en_US.UTF-8"
# Drop paths leaked from a previously activated conda env or sourced ROS workspace
# (e.g. the old piper_env): CMake would otherwise pick that env's rosidl_cmake.
CMAKE_PREFIX_PATH = ""
COLCON_PREFIX_PATH = ""
PYTHONPATH = ""

[feature.humble]
channels = ["https://repo.prefix.dev/robostack-humble"]

[feature.humble.dependencies]
ros-humble-desktop = "*"
ros-humble-rmw-cyclonedds-cpp = "*"
ros-humble-rosidl-generator-dds-idl = "*"
ros-humble-plotjuggler-ros = "*"
ros-humble-xacro = "*"
ros-humble-joint-state-publisher-gui = "*"
ros-humble-topic-tools = "*"
ros-humble-generate-parameter-library-py = "*"
ros-humble-ros2-control = "*"
ros-humble-ros2-controllers = "*"
ros-humble-moveit = "*"
ros-humble-moveit-ros-perception = "*"

[feature.lyrical]
channels = ["https://repo.prefix.dev/robostack-lyrical"]

[feature.lyrical.dependencies]
ros-lyrical-desktop = "*"
ros-lyrical-rmw-cyclonedds-cpp = "*"
ros-lyrical-rosidl-generator-dds-idl = "*"
ros-lyrical-plotjuggler-ros = "*"
ros-lyrical-xacro = "*"
ros-lyrical-joint-state-publisher-gui = "*"
ros-lyrical-topic-tools = "*"
ros-lyrical-generate-parameter-library-py = "*"
ros-lyrical-ros2-control = "*"
ros-lyrical-ros2-controllers = "*"
ros-lyrical-moveit = "*"
ros-lyrical-moveit-ros-perception = "*"

[environments]
# `pixi shell` with no -e activates lyrical (same solve group, so identical package versions)
default = { features = ["common", "lyrical"], solve-group = "lyrical" }
humble = ["common", "humble"]
lyrical = { features = ["common", "lyrical"], solve-group = "lyrical" }
