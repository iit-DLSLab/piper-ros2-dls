compliance_bridge:
  input_topic:
    type: string
    default_value: "~/move_mit_joint_states"
    description: "sensor_msgs/msg/JointState topic to subscribe to."
  output_topic:
    type: string
    default_value: "~/control/move_mit"
    description: "agx_arm_msgs/msg/MoveMITMsg topic to publish compliant commands on."
  joints:
    type: string_array
    description: "Ordered joint names to control. A joint's position in this list is the joint_index it is published with in MoveMITMsg. Only JointState entries whose name appears here are forwarded. Required, must be set via YAML."
  compliance:
    __map_joints:
      kp:
        type: double
        default_value: 1.0
        description: "MIT-mode position gain (stiffness) for this joint."
        validation:
          gt_eq<>: [0]
      kd:
        type: double
        default_value: 0.5
        description: "MIT-mode velocity gain (damping) for this joint."
        validation:
          gt_eq<>: [0]
      feedforward_torque:
        type: double
        default_value: 0.0
        description: "MIT-mode feed-forward torque added for this joint."
